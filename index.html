<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Strict Content Security Policy: Local execution, provider API endpoints only, no third party scripts -->

      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';

        https://generativelanguage.googleapis.com
        https://api.openai.com
        https://api.x.ai
        https://api.mistral.ai
        blob: data:;
      frame-src 'self' blob: data:;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
    " />
    <title>OpenScreens — Multi-Model AI Office</title>
  </head>
  <body class="bg-[var(--bg-app)] text-[var(--text-main)] antialiased selection:bg-emerald-500 selection:text-white min-h-screen transition-colors duration-200">
